services:
  ssv.avado.dappnode.eth:
    build:
      context: build
      args:
        UPSTREAM_VERSION: v2.2.1
    image: 'ssv.avado.dappnode.eth:0.0.13'
    restart: always
    volumes:
      - 'ssv:/data'
    ports:
      - '13002:13001'
      - '12002:12001/udp'
      - '15001'
    environment:
      - 'BEACONNODEADDR=http://teku.my.ava.do:5051'
      - 'EXECUTIONCLIENTADDR=ws://avado-dnp-nethermind.my.ava.do:8545'
      - NETWORK=mainnet
volumes:
  ssv: {}
