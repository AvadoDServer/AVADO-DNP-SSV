version: '3.4'
services:
  ssv-holesky.avado.dappnode.eth:
    build:
      context: build
      args:
        UPSTREAM_VERSION: v1.2.3
    image: 'ssv-holesky.avado.dappnode.eth:0.0.11'
    restart: always
    volumes:
      - 'ssv:/data'
    ports:
      - '13002:13001'
      - '12002:12001/udp'
      - '15001'
    environment:
      - 'BEACONNODEADDR=http://teku-holesky.my.ava.do:5051'
      - 'EXECUTIONCLIENTADDR=ws://holesky-geth.my.ava.do:8546'
      - NETWORK=holesky
volumes:
  ssv: {}
